<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .net   { fill: #161b22; stroke: #6e7681; }
      .box   { fill: #0d1117; stroke: #8b949e; }
      .gw    { fill: #0c2d6b; stroke: #4493f8; }
      .title { fill: #e6edf3; }
      .text  { fill: #c9d1d9; }
      .label { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .line  { stroke: #e6edf3; }
      .dash  { stroke: #8b949e; }
      .head  { fill: #e6edf3; }
      .headm { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head" fill="#1f2328"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="headm" fill="#6e7781"/>
    </marker>
  </defs>

  <rect class="bg" fill="#ffffff" x="0" y="0" width="960" height="460"/>

  <!-- Docker network -->
  <rect class="net" fill="#f6f8fa" stroke="#8c959f" x="200" y="20" width="740" height="420" rx="12" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text class="muted" fill="#6e7781" font-size="12" x="216" y="42">Docker network — only the gateway publishes a port</text>

  <!-- Client -->
  <rect class="box" fill="#ffffff" stroke="#57606a" x="20" y="195" width="130" height="70" rx="8" stroke-width="1.5"/>
  <text class="title" fill="#1f2328" font-size="16" font-weight="600" x="85" y="226" text-anchor="middle">You</text>
  <text class="text code" fill="#424a53" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="85" y="246" text-anchor="middle">curl</text>

  <!-- Gateway -->
  <rect class="gw" fill="#ddf4ff" stroke="#0969da" x="240" y="60" width="200" height="360" rx="10" stroke-width="2"/>
  <text class="title" fill="#1f2328" font-size="16" font-weight="600" x="340" y="200" text-anchor="middle">KrakenD gateway</text>
  <text class="muted code" fill="#6e7781" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="340" y="220" text-anchor="middle">host :8000 → :8080</text>
  <text class="text" fill="#424a53" font-size="13" x="268" y="250">• validates JWT</text>
  <text class="text" fill="#424a53" font-size="13" x="268" y="270">• checks route role</text>
  <text class="text" fill="#424a53" font-size="13" x="268" y="290">• rate-limits login</text>

  <!-- Auth service -->
  <rect class="box" fill="#ffffff" stroke="#57606a" x="640" y="60" width="270" height="140" rx="10" stroke-width="1.5"/>
  <text class="title" fill="#1f2328" font-size="16" font-weight="600" x="660" y="88">Auth service</text>
  <text class="muted" fill="#6e7781" font-size="12" x="660" y="106">ASP.NET Core 10</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="132">• checks password (PBKDF2)</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="152">• signs JWT with RSA private key</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="172">• serves JWKS + discovery</text>

  <!-- Demo API -->
  <rect class="box" fill="#ffffff" stroke="#57606a" x="640" y="280" width="270" height="140" rx="10" stroke-width="1.5"/>
  <text class="title" fill="#1f2328" font-size="16" font-weight="600" x="660" y="308">Demo API</text>
  <text class="muted" fill="#6e7781" font-size="12" x="660" y="326">ASP.NET Core 10</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="352">• validates JWT again</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="372">• enforces role policies</text>
  <text class="text" fill="#424a53" font-size="13" x="660" y="392">• returns dummy data</text>

  <!-- Client -> gateway -->
  <line class="line" stroke="#1f2328" stroke-width="1.6" fill="none" x1="150" y1="230" x2="238" y2="230" marker-end="url(#a)"/>
  <text class="label code" fill="#1f2328" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="160" y="220">:8000</text>

  <!-- Gateway -> auth: login -->
  <line class="line" stroke="#1f2328" stroke-width="1.6" fill="none" x1="440" y1="100" x2="638" y2="100" marker-end="url(#a)"/>
  <text class="label code" fill="#1f2328" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="540" y="91" text-anchor="middle">POST /auth/login</text>

  <!-- Auth -> gateway: JWKS -->
  <line class="dash" stroke="#6e7781" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="640" y1="160" x2="442" y2="160" marker-end="url(#m)"/>
  <text class="muted" fill="#6e7781" font-size="12" x="540" y="151" text-anchor="middle">public key (JWKS)</text>

  <!-- Gateway -> API -->
  <line class="line" stroke="#1f2328" stroke-width="1.6" fill="none" x1="440" y1="340" x2="638" y2="340" marker-end="url(#a)"/>
  <text class="label code" fill="#1f2328" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" x="540" y="331" text-anchor="middle">GET /api/…</text>
  <text class="muted" fill="#6e7781" font-size="12" x="540" y="360" text-anchor="middle">+ Bearer token</text>

  <!-- Auth -> API: discovery + JWKS -->
  <line class="dash" stroke="#6e7781" stroke-width="1.6" fill="none" stroke-dasharray="6 4" x1="775" y1="202" x2="775" y2="278" marker-end="url(#m)"/>
  <text class="muted" fill="#6e7781" font-size="12" x="785" y="236">discovery +</text>
  <text class="muted" fill="#6e7781" font-size="12" x="785" y="252">public key (JWKS)</text>
</svg>
